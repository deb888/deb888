name: 🧠 Neural Sync — Auto Update Profile

on:
  schedule:
    # Run daily at 03:00 UTC (quiet hours)
    - cron: '0 3 * * *'
  workflow_dispatch:  # Manual trigger
  push:
    paths:
      - 'README.md'
      - 'assets/svg/*.svg'

permissions:
  contents: write

jobs:
  neural-sync:
    name: 🔄 Sync Neural State
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: 🛠 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: |
          npm ci --prefer-offline --no-audit --progress=false 2>/dev/null || true
      
      - name: 🔄 Update "Last Neural Sync" date
        id: update-date
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          TIME=$(date -u +"%H:%M UTC")
          
          # Update the date in README
          sed -i "s/LAST SYNC: [0-9-]*/LAST SYNC: $DATE/" README.md
          sed -i "s/Last Neural Sync: [0-9-]*/Last Neural Sync: $DATE/" README.md
          sed -i "s/Last sync: [0-9-]*/Last sync: $DATE/" README.md
          
          # Also update in SVG files if they have date placeholders
          find assets/svg -name "*.svg" -exec sed -i "s/LAST SYNC: [0-9-]*/LAST SYNC: $DATE/" {} \;
          
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "time=$TIME" >> $GITHUB_OUTPUT
      
      - name: 📊 Regenerate dynamic badges (optional)
        if: false  # Set to true if you want to regenerate SVGs
        run: |
          # This would regenerate SVGs with fresh data
          # Requires additional setup with headless browser
          echo "Skipping SVG regeneration"
      
      - name: 📝 Check for changes
        id: check-changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected:"
            git diff --stat
          fi
      
      - name: 🚀 Commit & Push Updates
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add README.md assets/svg/
          git commit -m "chore: neural sync $(date -u +'%Y-%m-%d') 🤖

          - Updated last sync timestamp
          - Auto-generated by Neural Sync workflow
          
          [skip ci]"
          git push origin main
      
      - name: 📢 Notify on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Neural Sync Failed',
              body: 'The automated profile update workflow failed. Check the Actions tab for details.',
              labels: ['bug', 'automation']
            })

  # Optional: Validate SVG files
  validate-svgs:
    name: ✅ Validate SVG Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check SVG syntax
        run: |
          for f in assets/svg/*.svg; do
            echo "Validating $f..."
            xmllint --noout "$f" 2>/dev/null || echo "⚠️  $f has XML issues (may still render in browsers)"
          done
      
      - name: Check file sizes
        run: |
          for f in assets/svg/*.svg; do
            size=$(wc -c < "$f")
            if [ $size -gt 100000 ]; then
              echo "⚠️  $f is ${size} bytes (>100KB) - consider optimizing"
            else
              echo "✅ $f: ${size} bytes"
            fi
          done

  # Optional: Generate social preview image
  generate-preview:
    name: 🖼 Generate Social Preview
    runs-on: ubuntu-latest
    if: false  # Enable when you have a preview generator
    steps:
      - uses: actions/checkout@v4
      - name: Generate OG image
        run: |
          # Use a headless browser to render README and screenshot
          # npx shot-scraper https://github.com/deb888 -o assets/og-image.png
          echo "Preview generation not configured"