<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117"/>
      <stop offset="50%" style="stop-color:#161B22"/>
      <stop offset="100%" style="stop-color:#0D1117"/>
    </linearGradient>
    <linearGradient id="glowText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00FFE7"/>
      <stop offset="30%" style="stop-color:#3A86FF"/>
      <stop offset="60%" style="stop-color:#FF006E"/>
      <stop offset="100%" style="stop-color:#FFBE0B"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00FFE7"/>
      <stop offset="100%" style="stop-color:#00D4AA"/>
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF006E"/>
      <stop offset="100%" style="stop-color:#D63384"/>
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00FFE7;stop-opacity:0.08"/>
      <stop offset="50%" style="stop-color:#FF006E;stop-opacity:0.04"/>
      <stop offset="100%" style="stop-color:#00FFE7;stop-opacity:0.08"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStrong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStronger" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="url(#gridGrad)" stroke-width="0.5"/>
    </pattern>
    <pattern id="dots" width="15" height="15" patternUnits="userSpaceOnUse">
      <circle cx="7.5" cy="7.5" r="1" fill="#00FFE7" opacity="0.15"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="250" fill="url(#bg)"/>
  <rect width="900" height="250" fill="url(#grid)"/>
  <rect width="900" height="250" fill="url(#dots)"/>
  
  <!-- Corner decorative elements -->
  <path d="M0,0 L40,0 L40,3 L3,3 L3,40 L0,40 Z" fill="url(#neonCyan)" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M900,0 L860,0 L860,3 L897,3 L897,40 L900,40 Z" fill="url(#neonPink)" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite" begin="0.5s"/>
  </path>
  <path d="M0,250 L40,250 L40,247 L3,247 L3,210 L0,210 Z" fill="url(#neonPink)" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite" begin="1s"/>
  </path>
  <path d="M900,250 L860,250 L860,247 L897,247 L897,210 L900,210 Z" fill="url(#neonCyan)" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite" begin="1.5s"/>
  </path>
  
  <!-- Central neural node -->
  <g transform="translate(450, 125)">
    <!-- Outer ring -->
    <circle r="65" fill="none" stroke="url(#neonCyan)" stroke-width="1" opacity="0.3" filter="url(#glowStronger)">
      <animate attributeName="r" values="60;70;60" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="50" fill="none" stroke="url(#neonPink)" stroke-width="1" opacity="0.4" filter="url(#glowStrong)">
      <animate attributeName="r" values="45;55;45" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="35" fill="none" stroke="url(#neonCyan)" stroke-width="1.5" opacity="0.5" filter="url(#glow)">
      <animate attributeName="r" values="32;38;32" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Center brain emoji -->
    <text x="0" y="12" text-anchor="middle" font-size="32">🧠</text>
  </g>
  
  <!-- Orbiting particles -->
  <g>
    <circle cx="450" cy="125" r="3" fill="#00FFE7" filter="url(#glow)">
      <animateMotion dur="4s" repeatCount="indefinite" path="M0,-60 A60,60 0 1,1 0,60 A60,60 0 1,1 0,-60"/>
    </circle>
    <circle cx="450" cy="125" r="2" fill="#FF006E" filter="url(#glow)">
      <animateMotion dur="5s" repeatCount="indefinite" path="M0,-50 A50,50 0 1,1 0,50 A50,50 0 1,1 0,-50"/>
    </circle>
    <circle cx="450" cy="125" r="1.5" fill="#3A86FF" filter="url(#glow)">
      <animateMotion dur="3s" repeatCount="indefinite" path="M0,-70 A70,70 0 1,0 0,70 A70,70 0 1,0 0,-70"/>
    </circle>
    <circle cx="450" cy="125" r="2" fill="#FFBE0B" filter="url(#glow)">
      <animateMotion dur="6s" repeatCount="indefinite" path="M0,-40 A40,40 0 1,1 0,40 A40,40 0 1,1 0,-40"/>
    </circle>
  </g>
  
  <!-- Connection lines from center -->
  <g stroke-width="0.5" fill="none" opacity="0.4">
    <line x1="450" y1="125" x2="120" y2="50" stroke="#00FFE7" stroke-dasharray="4,4">
      <animate attributeName="stroke-dashoffset" values="0;40;0" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="450" y1="125" x2="120" y2="200" stroke="#FF006E" stroke-dasharray="4,4">
      <animate attributeName="stroke-dashoffset" values="0;40;0" dur="3s" repeatCount="indefinite" begin="0.5s"/>
    </line>
    <line x1="450" y1="125" x2="780" y2="50" stroke="#3A86FF" stroke-dasharray="4,4">
      <animate attributeName="stroke-dashoffset" values="0;40;0" dur="3s" repeatCount="indefinite" begin="1s"/>
    </line>
    <line x1="450" y1="125" x2="780" y2="200" stroke="#FFBE0B" stroke-dasharray="4,4">
      <animate attributeName="stroke-dashoffset" values="0;40;0" dur="3s" repeatCount="indefinite" begin="1.5s"/>
    </line>
  </g>
  
  <!-- Text nodes -->
  <g font-family="'JetBrains Mono', 'Fira Code', monospace">
    <g transform="translate(120, 50)">
      <text x="0" y="0" text-anchor="middle" font-size="12" font-weight="700" fill="#00FFE7" filter="url(#glow)">LANGCHAIN</text>
      <text x="0" y="18" text-anchor="middle" font-size="8" fill="#8B949E">LangGraph · Agents · RAG</text>
    </g>
    <g transform="translate(120, 200)">
      <text x="0" y="0" text-anchor="middle" font-size="12" font-weight="700" fill="#FF006E" filter="url(#glow)">OPENCLAW</text>
      <text x="0" y="18" text-anchor="middle" font-size="8" fill="#8B949E">Workflows · Skills · Gateway</text>
    </g>
    <g transform="translate(780, 50)">
      <text x="0" y="0" text-anchor="middle" font-size="12" font-weight="700" fill="#61DAFB" filter="url(#glow)">REACT NATIVE</text>
      <text x="0" y="18" text-anchor="middle" font-size="8" fill="#8B949E">Expo · iOS · Android</text>
    </g>
    <g transform="translate(780, 200)">
      <text x="0" y="0" text-anchor="middle" font-size="11" font-weight="700" fill="#8338EC" filter="url(#glow)">AI DEVOPS</text>
      <text x="0" y="18" text-anchor="middle" font-size="8" fill="#8B949E">K8s · vLLM · OpenCode</text>
    </g>
  </g>
  
  <!-- Floating particles -->
  <g>
    <circle cx="50" cy="80" r="1" fill="#00FFE7" opacity="0.6">
      <animate attributeName="cy" values="80;180;80" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="150" r="1" fill="#FF006E" opacity="0.6">
      <animate attributeName="cy" values="150;40;150" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="30" r="1.5" fill="#3A86FF" opacity="0.5">
      <animate attributeName="cy" values="30;220;30" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="650" cy="220" r="1" fill="#FFBE0B" opacity="0.5">
      <animate attributeName="cy" values="220;30;220" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Status indicator -->
  <g transform="translate(20, 235)">
    <circle cx="5" cy="0" r="4" fill="#3FB950">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="15" y="3" font-family="monospace" font-size="9" fill="#3FB950">SYSTEM ONLINE</text>
  </g>
  
  <!-- deb888 text -->
  <text x="450" y="238" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8B949E" letter-spacing="4" opacity="0.6">
    deb888 · github.io
  </text>
</svg>