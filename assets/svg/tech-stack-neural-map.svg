<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#161B22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00FFE7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00D4AA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00FFE7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF006E;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D63384;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF006E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="neonOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFBE0B;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FB5607;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFBE0B;stop-opacity:1" />
    </linearGradient>
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowPink" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowOrange" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="url(#neonCyan)" stroke-width="0.3" opacity="0.15"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGrad)"/>
  <rect width="800" height="400" fill="url(#grid)"/>
  
  <!-- Animated border -->
  <rect x="2" y="2" width="796" height="396" fill="none" stroke="url(#neonCyan)" stroke-width="1" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="24" font-weight="700" fill="url(#neonCyan)" filter="url(#glowCyan)">
    ⚡ TECH STACK NEURAL MAP ⚡
  </text>
  <text x="400" y="75" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8B949E" letter-spacing="3">
    deb888.github.io  •  LAST SYNC: <span id="date"></span>
  </text>
  
  <!-- Category nodes -->
  <g id="categories">
    <!-- AI/ML Layer -->
    <g class="node-group" transform="translate(120, 140)">
      <circle r="55" fill="#0D1117" stroke="url(#neonCyan)" stroke-width="2" filter="url(#glowCyan)">
        <animate attributeName="r" values="55;58;55" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="stroke-width" values="2;3;2" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="-15" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="url(#neonCyan)">AI / ML</text>
      <text x="0" y="5" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#8B949E">FOUNDATION</text>
      <text x="0" y="20" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7" fill="#FFBE0B">▼</text>
      <text x="0" y="35" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="6" fill="#58A6FF">Llama 3.1 • Qwen2.5</text>
      <text x="0" y="45" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="6" fill="#58A6FF">Nemotron 3 • MoE</text>
    </g>
    
    <!-- Agent Orchestration -->
    <g class="node-group" transform="translate(300, 140)">
      <circle r="55" fill="#0D1117" stroke="url(#neonPink)" stroke-width="2" filter="url(#glowPink)">
        <animate attributeName="r" values="55;58;55" dur="2s" repeatCount="indefinite" begin="0.3s"/>
        <animate attributeName="stroke-width" values="2;3;2" dur="2s" repeatCount="indefinite" begin="0.3s"/>
      </circle>
      <text x="0" y="-15" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="url(#neonPink)">AGENTS</text>
      <text x="0" y="5" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#8B949E">ORCHESTRATION</text>
      <text x="0" y="20" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7" fill="#FFBE0B">▼</text>
      <text x="0" y="35" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="6" fill="#F78166">LangGraph • CrewAI</text>
      <text x="0" y="45" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="6" fill="#F78166">AutoGen • MCP/ACP</text>
    </g>
    
    <!-- RAG/Knowledge -->
    <g class="node-group" transform="translate(480, 140)">
      <circle r="55" fill="#0D1117" stroke="url(#neonOrange)" stroke-width="2" filter="url(#glowOrange)">
        <animate attributeName="r" values="55;58;55" dur="2s" repeatCount="indefinite" begin="0.6s"/>
        <animate attributeName="stroke-width" values="2;3;2" dur="2s" repeatCount="indefinite" begin="0.6s"/>
      </circle>
      <text x="0" y="-15" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="url(#neonOrange)">RAG 2.0</text>
      <text x="0" y="5" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#8B949E">KNOWLEDGE</text>
      <text x="0" y="20" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7" fill="#FFBE0B">▼</text>
      <text x="0" y="35" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="6" fill="#A5D6FF">GraphRAG • Hybrid</text>
      <text x="0" y="45" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="6" fill="#A5D6FF">Agentic RAG • Qdrant</text>
    </g>
    
    <!-- Frontend -->
    <g class="node-group" transform="translate(660, 140)">
      <circle r="55" fill="#0D1117" stroke="#DD0031" stroke-width="2" filter="url(#glowPink)">
        <animate attributeName="r" values="55;58;55" dur="2s" repeatCount="indefinite" begin="0.9s"/>
      </circle>
      <text x="0" y="-15" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#DD0031">ANGULAR</text>
      <text x="0" y="5" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#8B949E">v18+ SIGNALS</text>
      <text x="0" y="20" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7" fill="#FFBE0B">▼</text>
      <text x="0" y="35" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="6" fill="#F78166">RxJS • NgRx</text>
      <text x="0" y="45" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="6" fill="#F78166">Standalone • SSR</text>
    </g>
  </g>
  
  <!-- Connection lines with flow animation -->
  <g id="connections" stroke-width="1.5" fill="none">
    <path d="M175,140 Q240,140 245,140" stroke="url(#neonCyan)" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" values="0;20;0" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M355,140 Q418,140 425,140" stroke="url(#neonPink)" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" values="0;20;0" dur="2s" repeatCount="indefinite" begin="0.3s"/>
    </path>
    <path d="M535,140 Q598,140 605,140" stroke="url(#neonOrange)" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" values="0;20;0" dur="2s" repeatCount="indefinite" begin="0.6s"/>
    </path>
  </g>
  
  <!-- Bottom Layer: Infrastructure -->
  <g id="infra-layer" transform="translate(0, 220)">
    <!-- Kubernetes -->
    <g class="node-group" transform="translate(120, 0)">
      <rect x="-60" y="-40" width="120" height="80" rx="12" fill="#0D1117" stroke="#326CE5" stroke-width="2" filter="url(#glowCyan)">
        <animate attributeName="stroke-width" values="2;3;2" dur="3s" repeatCount="indefinite"/>
      </rect>
      <text x="0" y="-15" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#326CE5">☸ KUBERNETES</text>
      <text x="0" y="0" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7" fill="#8B949E">v1.29+ • EKS/GKE/AKS</text>
      <text x="0" y="12" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="6" fill="#58A6FF">Operators • CRDs</text>
      <text x="0" y="22" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="6" fill="#58A6FF">ArgoCD • Crossplane</text>
    </g>
    
    <!-- Terraform -->
    <g class="node-group" transform="translate(300, 0)">
      <rect x="-60" y="-40" width="120" height="80" rx="12" fill="#0D1117" stroke="#7B42BC" stroke-width="2" filter="url(#glowPink)">
        <animate attributeName="stroke-width" values="2;3;2" dur="3s" repeatCount="indefinite" begin="0.5s"/>
      </rect>
      <text x="0" y="-15" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#7B42BC">🏗 TERRAFORM</text>
      <text x="0" y="0" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7" fill="#8B949E">v1.9+ • HCP Terraform</text>
      <text x="0" y="12" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="6" fill="#D2A8FF">Modules • Workspaces</text>
      <text x="0" y="22" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="6" fill="#D2A8FF">Policy-as-Code</text>
    </g>
    
    <!-- Service Mesh -->
    <g class="node-group" transform="translate(480, 0)">
      <rect x="-60" y="-40" width="120" height="80" rx="12" fill="#0D1117" stroke="#00FFE7" stroke-width="2" filter="url(#glowCyan)">
        <animate attributeName="stroke-width" values="2;3;2" dur="3s" repeatCount="indefinite" begin="1s"/>
      </rect>
      <text x="0" y="-15" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00FFE7">🕸 ISTIO</text>
      <text x="0" y="0" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7" fill="#8B949E">mTLS • Traffic Mgmt</text>
      <text x="0" y="12" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="6" fill="#A5D6FF">Envoy • Kiali</text>
      <text x="0" y="22" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="6" fill="#A5D6FF">Resilience Policies</text>
    </g>
    
    <!-- Observability -->
    <g class="node-group" transform="translate(660, 0)">
      <rect x="-60" y="-40" width="120" height="80" rx="12" fill="#0D1117" stroke="#F02E65" stroke-width="2" filter="url(#glowPink)">
        <animate attributeName="stroke-width" values="2;3;2" dur="3s" repeatCount="indefinite" begin="1.5s"/>
      </rect>
      <text x="0" y="-15" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#F02E65">📊 OBSERVABILITY</text>
      <text x="0" y="0" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7" fill="#8B949E">Grafana • Tempo</text>
      <text x="0" y="12" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="6" fill="#F78166">Loki • Pyroscope</text>
      <text x="0" y="22" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="6" fill="#F78166">OTEL • SLOs</text>
    </g>
  </g>
  
  <!-- Vertical connections -->
  <g stroke-width="1" fill="none" stroke-dasharray="4,4" opacity="0.6">
    <path d="M120,210 V240" stroke="url(#neonCyan)">
      <animate attributeName="stroke-dashoffset" values="0;10;0" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M300,210 V240" stroke="url(#neonPink)">
      <animate attributeName="stroke-dashoffset" values="0;10;0" dur="2s" repeatCount="indefinite" begin="0.3s"/>
    </path>
    <path d="M480,210 V240" stroke="url(#neonOrange)">
      <animate attributeName="stroke-dashoffset" values="0;10;0" dur="2s" repeatCount="indefinite" begin="0.6s"/>
    </path>
    <path d="M660,210 V240" stroke="#DD0031">
      <animate attributeName="stroke-dashoffset" values="0;10;0" dur="2s" repeatCount="indefinite" begin="0.9s"/>
    </path>
  </g>
  
  <!-- Bottom: CI/CD & Data Layer -->
  <g id="data-layer" transform="translate(0, 330)">
    <g class="node-group" transform="translate(120, 0)">
      <ellipse rx="70" ry="25" fill="#0D1117" stroke="#2088FF" stroke-width="2"/>
      <text x="0" y="0" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#2088FF">CI/CD</text>
      <text x="0" y="12" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="6" fill="#8B949E">GitHub Actions • Argo Workflows</text>
    </g>
    
    <g class="node-group" transform="translate(300, 0)">
      <ellipse rx="70" ry="25" fill="#0D1117" stroke="#336791" stroke-width="2"/>
      <text x="0" y="0" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#336791">POSTGRES</text>
      <text x="0" y="12" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="6" fill="#8B949E">TimescaleDB • pgvector</text>
    </g>
    
    <g class="node-group" transform="translate(480, 0)">
      <ellipse rx="70" ry="25" fill="#0D1117" stroke="#DC382D" stroke-width="2"/>
      <text x="0" y="0" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#DC382D">REDIS</text>
      <text x="0" y="12" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="6" fill="#8B949E">Cluster • Streams • Vector</text>
    </g>
    
    <g class="node-group" transform="translate(660, 0)">
      <ellipse rx="70" ry="25" fill="#0D1117" stroke="#005571" stroke-width="2"/>
      <text x="0" y="0" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#005571">KAFKA</text>
      <text x="0" y="12" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="6" fill="#8B949E">Redpanda • Schema Registry</text>
    </g>
  </g>
  
  <!-- Floating particles -->
  <g id="particles">
    <circle cx="50" cy="50" r="1.5" fill="#00FFE7" opacity="0.7">
      <animate attributeName="cy" values="50;350;50" dur="15s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="15s" repeatCount="indefinite"/>
    </circle>
    <circle cx="750" cy="100" r="1" fill="#FF006E" opacity="0.7">
      <animate attributeName="cy" values="100;300;100" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="380" r="1.2" fill="#FFBE0B" opacity="0.7">
      <animate attributeName="cy" values="380;50;380" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="20" r="1" fill="#58A6FF" opacity="0.7">
      <animate attributeName="cy" values="20;380;20" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="10s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Status indicator -->
  <g transform="translate(700, 20)">
    <circle r="6" fill="#3FB950">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="14" y="4" font-family="'JetBrains Mono', monospace" font-size="10" fill="#3FB950" font-weight="600">SYSTEM ONLINE</text>
  </g>
  
  <script type="text/javascript">
    <![CDATA[
      document.getElementById('date').textContent = new Date().toISOString().split('T')[0];
    ]]>
  </script>
</svg>